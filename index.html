<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realistic Solar System - Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 8px;
      pointer-events: none;
      backdrop-filter: blur(5px);
      font-size: 14px;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.6);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    @media (max-width: 700px) {
      #info { font-size: 12px; padding: 6px 12px; }
      .controls-hint { font-size: 12px; padding: 4px 12px; }
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>🌌 SOLAR SYSTEM</h2>
    <p>Drag to rotate • Scroll to zoom</p>
  </div>
  <div class="controls-hint">🪐 Realistic scale (sizes exaggerated) • Orbits visible</div>

  <!-- Import maps and libraries -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- Initialize Scene, Cameras, Renderers ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510); // Deep space color

    // Main perspective camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 25, 45);
    camera.lookAt(0, 0, 0);

    // WebGL Renderer
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap for performance
    renderer.shadowMap.enabled = true; // Enable shadows for depth
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // CSS2 Renderer for labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none'; // Allow clicking through to canvas
    document.body.appendChild(labelRenderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.5;
    controls.panSpeed = 0.7;
    controls.target.set(0, 0, 0);
    controls.maxDistance = 200;
    controls.minDistance = 5;
    controls.update();

    // --- Lighting ---
    // Ambient light to softly illuminate dark sides
    const ambientLight = new THREE.AmbientLight(0x111122, 0.7);
    scene.add(ambientLight);
    
    // The main light source is the Sun itself (point light at center)
    const sunLight = new THREE.PointLight(0xffeedd, 2.5, 0, 0);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);
    
    // Additional directional light to slightly highlight planet features
    const dirLight = new THREE.DirectionalLight(0x446688, 0.4);
    dirLight.position.set(10, 20, 5);
    scene.add(dirLight);

    // --- Starfield Background (Particle System) ---
    function createStarfield() {
      const starsGeometry = new THREE.BufferGeometry();
      const starsCount = 2000;
      const starsPositions = new Float32Array(starsCount * 3);
      
      for (let i = 0; i < starsCount * 3; i += 3) {
        // Random sphere distribution with radius 150-300
        const radius = 80 + Math.random() * 150;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.asin((Math.random() * 2) - 1);
        
        starsPositions[i] = Math.cos(theta) * Math.cos(phi) * radius;
        starsPositions[i+1] = Math.sin(phi) * radius;
        starsPositions[i+2] = Math.sin(theta) * Math.cos(phi) * radius;
      }
      
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
      
      const starsMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.25,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.9
      });
      
      const stars = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(stars);
      
      // Add a second layer of smaller, more distant stars
      const starsGeometry2 = new THREE.BufferGeometry();
      const starsPositions2 = new Float32Array(1500 * 3);
      for (let i = 0; i < 1500 * 3; i += 3) {
        const radius = 180 + Math.random() * 200;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.asin((Math.random() * 2) - 1);
        starsPositions2[i] = Math.cos(theta) * Math.cos(phi) * radius;
        starsPositions2[i+1] = Math.sin(phi) * radius;
        starsPositions2[i+2] = Math.sin(theta) * Math.cos(phi) * radius;
      }
      starsGeometry2.setAttribute('position', new THREE.BufferAttribute(starsPositions2, 3));
      const stars2 = new THREE.Points(starsGeometry2, new THREE.PointsMaterial({
        color: 0xaaccff,
        size: 0.15,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.7
      }));
      scene.add(stars2);
    }
    createStarfield();

    // --- Texture Loader ---
    const loader = new THREE.TextureLoader();
    
    // Helper to create a label
    function createLabel(text, color = '#ffffff') {
      const div = document.createElement('div');
      div.textContent = text;
      div.style.color = color;
      div.style.fontWeight = 'bold';
      div.style.fontSize = '16px';
      div.style.textShadow = '1px 1px 3px black';
      div.style.background = 'rgba(0,0,0,0.6)';
      div.style.padding = '2px 8px';
      div.style.borderRadius = '4px';
      return new CSS2DObject(div);
    }

    // --- Planetary Data ---
    // Sizes and distances are exaggerated for visibility, but relative proportions are somewhat maintained.
    // Real scale would make planets tiny. Colors and textures aim for realism.
    
    const planetsData = [
      { name: 'Mercury', color: 0xaaaaaa, size: 0.8, distance: 4.5, speed: 0.04, roughness: 0.7, metalness: 0.1, texture: 'mercury' },
      { name: 'Venus',   color: 0xffcc88, size: 0.95, distance: 7.0, speed: 0.025, roughness: 0.6, metalness: 0.05, texture: 'venus' },
      { name: 'Earth',   color: 0x2288ff, size: 1.0, distance: 9.5, speed: 0.02, roughness: 0.5, metalness: 0.1, texture: 'earth' },
      { name: 'Mars',    color: 0xc1440e, size: 0.7, distance: 12.5, speed: 0.017, roughness: 0.8, metalness: 0.2, texture: 'mars' },
      { name: 'Jupiter', color: 0xd8a27a, size: 2.8, distance: 17.0, speed: 0.012, roughness: 0.4, metalness: 0.0, texture: 'jupiter' },
      { name: 'Saturn',  color: 0xf0d8b0, size: 2.3, distance: 22.0, speed: 0.009, roughness: 0.5, metalness: 0.1, texture: 'saturn', hasRings: true },
      { name: 'Uranus',  color: 0x6fd4d4, size: 1.8, distance: 28.0, speed: 0.007, roughness: 0.4, metalness: 0.1, texture: 'uranus' },
      { name: 'Neptune', color: 0x4169e1, size: 1.7, distance: 33.0, speed: 0.005, roughness: 0.4, metalness: 0.1, texture: 'neptune' }
    ];

    // Store planet objects for animation
    const planets = [];
    
    // --- Create the Sun ---
    const sunGeometry = new THREE.SphereGeometry(2.2, 64, 64);
    // Sun texture with emissive properties
    const sunMaterial = new THREE.MeshStandardMaterial({
      color: 0xffaa00,
      emissive: new THREE.Color(0xff5500),
      roughness: 0.5,
      emissiveIntensity: 1.2
    });
    
    // Try to load sun texture, fallback to procedural
    loader.load('https://threejs.org/examples/textures/planets/sun.jpg', 
      (tex) => {
        sunMaterial.map = tex;
        sunMaterial.color.set(0xffffff);
        sunMaterial.emissive.set(0xff6600);
        sunMaterial.needsUpdate = true;
      },
      undefined, 
      () => console.log('Sun texture not loaded, using procedural color')
    );
    
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    sun.castShadow = false;
    sun.receiveShadow = false;
    scene.add(sun);
    
    // Sun label
    const sunLabel = createLabel('☀️ SUN', '#ffaa00');
    sunLabel.position.set(0, 2.8, 0);
    sun.add(sunLabel);
    
    // Add a subtle glow effect using a point light (already added) and a larger transparent sphere
    const sunGlowGeometry = new THREE.SphereGeometry(2.35, 32, 32);
    const sunGlowMaterial = new THREE.MeshBasicMaterial({
      color: 0xff6600,
      transparent: true,
      opacity: 0.15,
      blending: THREE.AdditiveBlending
    });
    const sunGlow = new THREE.Mesh(sunGlowGeometry, sunGlowMaterial);
    sun.add(sunGlow);

    // --- Create Orbits (visual circles) ---
    function createOrbitLine(radius, color = 0xffffff) {
      const points = [];
      const segments = 128;
      for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
      }
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ 
        color: color,
        opacity: 0.25,
        transparent: true
      });
      const orbitLine = new THREE.LineLoop(geometry, material);
      scene.add(orbitLine);
    }
    
    // Create orbits with slightly varying colors
    planetsData.forEach((p, index) => {
      const hue = (index * 0.1) % 1.0;
      const color = new THREE.Color().setHSL(hue, 0.5, 0.7);
      createOrbitLine(p.distance, color);
    });

    // --- Create Planets ---
    // Texture URLs (using Three.js examples and reliable sources)
    const textureBase = 'https://threejs.org/examples/textures/planets/';
    
    planetsData.forEach((data) => {
      // Planet group to handle orbit rotation
      const planetGroup = new THREE.Group();
      planetGroup.position.set(data.distance, 0, 0);
      scene.add(planetGroup);
      
      // Planet mesh
      const geometry = new THREE.SphereGeometry(data.size, 48, 48);
      const material = new THREE.MeshStandardMaterial({
        color: data.color,
        roughness: data.roughness,
        metalness: data.metalness,
      });
      
      const planet = new THREE.Mesh(geometry, material);
      planet.castShadow = true;
      planet.receiveShadow = true;
      planetGroup.add(planet);
      
      // Load texture
      const textureFile = data.texture + '.jpg';
      loader.load(textureBase + textureFile,
        (tex) => {
          material.map = tex;
          material.color.set(0xffffff);
          material.needsUpdate = true;
        },
        undefined,
        () => console.log(`Texture for ${data.name} not loaded, using color`)
      );
      
      // Add label
      const label = createLabel(data.name, '#ffffff');
      label.position.set(0, data.size + 0.6, 0);
      planet.add(label);
      
      // Saturn's rings
      if (data.hasRings) {
        const ringGeometry = new THREE.RingGeometry(data.size * 1.4, data.size * 2.2, 64);
        const ringMaterial = new THREE.MeshStandardMaterial({
          color: 0xc2b280,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.7,
          roughness: 0.4,
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = Math.PI / 2 + 0.1; // Slight tilt
        ring.receiveShadow = false;
        planet.add(ring);
        
        // Try to load ring texture
        loader.load('https://threejs.org/examples/textures/planets/saturn_ring.png',
          (tex) => {
            ringMaterial.map = tex;
            ringMaterial.color.set(0xffffff);
            ringMaterial.needsUpdate = true;
          },
          undefined,
          () => {}
        );
        
        // Second thinner ring
        const ring2Geometry = new THREE.RingGeometry(data.size * 1.2, data.size * 1.4, 64);
        const ring2Material = new THREE.MeshStandardMaterial({
          color: 0xddccaa,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.5,
          roughness: 0.5,
        });
        const ring2 = new THREE.Mesh(ring2Geometry, ring2Material);
        ring2.rotation.x = Math.PI / 2 + 0.1;
        planet.add(ring2);
      }
      
      // Store planet data for animation
      planets.push({
        group: planetGroup,
        planet: planet,
        distance: data.distance,
        speed: data.speed,
        name: data.name,
        angle: Math.random() * Math.PI * 2 // Random start position
      });
    });

    // --- Add Asteroid Belt (between Mars and Jupiter) ---
    function createAsteroidBelt() {
      const asteroidCount = 1800;
      const asteroidsGeometry = new THREE.BufferGeometry();
      const positions = new Float32Array(asteroidCount * 3);
      const colors = new Float32Array(asteroidCount * 3);
      
      const innerRadius = 14.5;
      const outerRadius = 16.2;
      const colorBase = new THREE.Color(0x887766);
      
      for (let i = 0; i < asteroidCount * 3; i += 3) {
        const angle = Math.random() * Math.PI * 2;
        const radius = innerRadius + Math.random() * (outerRadius - innerRadius);
        const yOffset = (Math.random() - 0.5) * 0.8;
        
        positions[i] = Math.cos(angle) * radius;
        positions[i+1] = yOffset;
        positions[i+2] = Math.sin(angle) * radius;
        
        const colorVariation = new THREE.Color(colorBase).multiplyScalar(0.7 + Math.random() * 0.5);
        colors[i] = colorVariation.r;
        colors[i+1] = colorVariation.g;
        colors[i+2] = colorVariation.b;
      }
      
      asteroidsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      asteroidsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      
      const asteroidsMaterial = new THREE.PointsMaterial({
        size: 0.08,
        vertexColors: true,
        blending: THREE.NormalBlending,
        depthWrite: true,
      });
      
      const asteroidBelt = new THREE.Points(asteroidsGeometry, asteroidsMaterial);
      scene.add(asteroidBelt);
      return asteroidBelt;
    }
    
    const asteroidBelt = createAsteroidBelt();

    // --- Add some distant stars / nebulae effect with a few larger particles ---
    const distantStarsGeometry = new THREE.BufferGeometry();
    const distantPositions = [];
    for (let i = 0; i < 400; i++) {
      const r = 40 + Math.random() * 60;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.asin((Math.random() * 2) - 1);
      distantPositions.push(Math.cos(theta) * Math.cos(phi) * r, Math.sin(phi) * r, Math.sin(theta) * Math.cos(phi) * r);
    }
    distantStarsGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(distantPositions), 3));
    const distantStarsMat = new THREE.PointsMaterial({
      color: 0x88aacc,
      size: 0.4,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.6
    });
    const distantStars = new THREE.Points(distantStarsGeometry, distantStarsMat);
    scene.add(distantStars);

    // --- Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);
      
      // Rotate planets around the sun
      planets.forEach(p => {
        p.angle += p.speed * 0.6; // Adjust overall speed
        p.group.position.x = Math.cos(p.angle) * p.distance;
        p.group.position.z = Math.sin(p.angle) * p.distance;
        
        // Rotate planet on its axis
        p.planet.rotation.y += 0.01;
      });
      
      // Rotate the Sun
      sun.rotation.y += 0.002;
      
      // Slowly rotate asteroid belt for subtle motion
      asteroidBelt.rotation.y += 0.0003;
      
      // Rotate distant stars slightly for immersive effect
      distantStars.rotation.y += 0.0001;
      
      // Update controls
      controls.update();
      
      // Render
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    animate();

    // --- Handle Window Resize ---
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    console.log('🌠 Solar System ready! Explore the planets.');
  </script>
</body>
</html>
